<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Teoria de Obstáculos Interativa - Quiz Completo</title>
<style>
  body { font-family: Arial, sans-serif; background: #f9f9f9; }
  h1 { text-align: center; margin-bottom: 20px; }
  .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 20px; }
  .alimento { background: #fff; border: 2px solid #ccc; border-radius: 10px; width: 250px; padding: 15px; cursor: pointer; transition: 0.3s; }
  .alimento:hover { border-color: #0077cc; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  .titulo { font-weight: bold; margin-bottom: 10px; text-align: center; }
  .obstaculos { display: flex; flex-direction: column; gap: 5px; }
  .obstaculo { background: #e0e0e0; padding: 5px 10px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
  .obstaculo:hover { background: #a0d2f0; }
  .quiz { margin-top: 10px; font-size: 14px; }
  .resposta { margin: 3px 0; cursor: pointer; padding: 3px 5px; border-radius: 3px; transition: 0.2s; }
  .resposta:hover { background: #d0f0d0; }
</style>
</head>
<body>
<h1>Teoria de Obstáculos - Alimentos com Quiz</h1>
<div class="container" id="alimentosContainer"></div>
<script>
const alimentos = [
  { nome: 'Iogurte natural', obstaculos: [
      {nome: 'Pasteurização', justificacao: 'Destrói maioria dos microrganismos iniciais.', microrganismos: 'Listeria, Salmonella, E. coli, microrganismos de deterioração', critico: false},
      {nome: 'Acidificação (pH baixo)', justificacao: 'Reduz pH, inibindo patogénios.', microrganismos: 'Listeria, Salmonella, E. coli', critico: true},
      {nome: 'Refrigeração', justificacao: 'Retarda crescimento microbiano residual.', microrganismos: 'Listeria, E. coli, microrganismos de deterioração', critico: false}
    ]
  },
  { nome: 'Presunto curado', obstaculos: [
      {nome: 'Sal / secagem (aw baixa)', justificacao: 'Reduz água disponível, dificulta multiplicação.', microrganismos: 'Staphylococcus aureus, Clostridium, bolores', critico: true},
      {nome: 'Maturação (competição microbiana)', justificacao: 'Microrganismos benéficos competem com patogénios.', microrganismos: 'Listeria, Staphylococcus', critico: false},
      {nome: 'pH levemente baixo', justificacao: 'Ambiente hostil para microrganismos.', microrganismos: 'Clostridium spp.', critico: false}
    ]
  },
  { nome: 'Queijo curado', obstaculos: [
      {nome: 'Sal (aw baixa)', justificacao: 'Reduz água disponível para microrganismos.', microrganismos: 'Listeria, Salmonella, E. coli, bolores', critico: false},
      {nome: 'Acidificação durante maturação', justificacao: 'Diminui pH, retardando crescimento microbiano.', microrganismos: 'Listeria, Salmonella, E. coli', critico: true},
      {nome: 'Microrganismos benéficos', justificacao: 'Competem por nutrientes e produzem antimicrobianos.', microrganismos: 'Listeria, Salmonella', critico: false},
      {nome: 'Refrigeração', justificacao: 'Limita multiplicação residual.', microrganismos: 'Listeria, bolores', critico: false}
    ]
  },
  { nome: 'Salsichas fermentadas', obstaculos: [
      {nome: 'Fermentação (pH baixo)', justificacao: 'Produz ácido láctico e baixa pH, inibindo patogénios.', microrganismos: 'Clostridium botulinum, Listeria, Salmonella, bolores', critico: true},
      {nome: 'Sal e secagem (aw baixa)', justificacao: 'Reduz água disponível.', microrganismos: 'Clostridium, Salmonella, bolores', critico: false},
      {nome: 'Conservantes opcionais', justificacao: 'Inibem microrganismos químicos.', microrganismos: 'Listeria, Salmonella', critico: false},
      {nome: 'Competição microbiana', justificacao: 'Estirpes benéficas competem com patogénios.', microrganismos: 'Listeria, Salmonella', critico: false}
    ]
  },
  { nome: 'Sumos de fruta pasteurizados', obstaculos: [
      {nome: 'Pasteurização (calor)', justificacao: 'Destrói microrganismos patogénicos e de deterioração.', microrganismos: 'E. coli, Salmonella, leveduras', critico: true},
      {nome: 'Baixo pH natural', justificacao: 'Inibe crescimento microbiano.', microrganismos: 'E. coli, leveduras', critico: false},
      {nome: 'Embalagem asséptica', justificacao: 'Impede contaminação pós-processamento.', microrganismos: 'Salmonella, leveduras', critico: false}
    ]
  },
  { nome: 'Conservas de vegetais', obstaculos: [
      {nome: 'Baixo pH (ácido acético)', justificacao: 'Inibe crescimento bacteriano.', microrganismos: 'Clostridium spp., Bacillus, bolores, leveduras', critico: true},
      {nome: 'Sal ou açúcar (aw baixa)', justificacao: 'Reduz água disponível.', microrganismos: 'Clostridium, Bacillus, bolores', critico: false},
      {nome: 'Tratamento térmico pré-selagem', justificacao: 'Destrói microrganismos antes do armazenamento.', microrganismos: 'Clostridium, Bacillus', critico: false}
    ]
  },
  { nome: 'Chocolate com recheio cremoso', obstaculos: [
      {nome: 'Baixa aw (açúcares, gordura)', justificacao: 'Reduz água disponível para microrganismos.', microrganismos: 'Salmonella, E. coli, leveduras e bolores em recheios', critico: true},
      {nome: 'Baixa temperatura de armazenamento', justificacao: 'Retarda crescimento microbiano.', microrganismos: 'Salmonella, leveduras', critico: false},
      {nome: 'pH baixo em alguns recheios', justificacao: 'Dificulta crescimento bacteriano.', microrganismos: 'Salmonella, bolores', critico: false}
    ]
  }
];

const container = document.getElementById('alimentosContainer');

alimentos.forEach(alimento => {
  const div = document.createElement('div');
  div.className = 'alimento';
  div.innerHTML = `<div class='titulo'>${alimento.nome}</div>`;

  const obstContainer = document.createElement('div');
  obstContainer.className = 'obstaculos';

  alimento.obstaculos.forEach(obst => {
    const obstDiv = document.createElement('div');
    obstDiv.className = 'obstaculo';
    obstDiv.innerText = obst.nome + (obst.critico ? ' ⭐' : '');
    obstDiv.onclick = () => {
      alert(`${obst.nome}\nJustificação: ${obst.justificacao}\nMicrorganismos afetados: ${obst.microrganismos}`);
    };
    obstContainer.appendChild(obstDiv);
  });

  // Quiz interativo
  const quizDiv = document.createElement('div');
  quizDiv.className = 'quiz';
  quizDiv.innerHTML = `<b>Qual é o obstáculo mais crítico?</b>`;

  alimento.obstaculos.forEach((obst, idx) => {
    const respDiv = document.createElement('div');
    respDiv.className = 'resposta';
    respDiv.innerText = obst.nome;
    respDiv.onclick = () => {
      if(obst.critico){
        alert('✅ Correcto! Este é o obstáculo mais crítico.');
      } else {
        alert('❌ Incorrecto. Tente novamente.');
      }
    };
    quizDiv.appendChild(respDiv);
  });

  div.appendChild(obstContainer);
  div.appendChild(quizDiv);
  container.appendChild(div);
});
</script>
</body>
</html>
